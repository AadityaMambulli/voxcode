name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        check: [ruff, mypy, pytest, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        if: matrix.check == 'ruff'
        run: ruff check .
      - name: Mypy
        if: matrix.check == 'mypy'
        run: mypy src
      - name: Pytest fake backends only
        if: matrix.check == 'pytest'
        run: pytest -m "not hardware"
      - name: Validate Claude manifests
        if: matrix.check == 'manifests'
        run: python scripts/validate_manifests.py
